name: rank_rush
description: "Rank Rush — a server-authoritative, provably-fair 52-card VIRTUAL-COIN multiplayer card game. Virtual coins only; no real-money features."
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.27+ (Dart 3.6+) is required for the Color.withValues() API used
  # throughout the UI (withOpacity is deprecated as of 3.27).
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  cloud_functions: ^5.1.5
  firebase_analytics: ^11.3.6
  firebase_messaging: ^15.1.6
  firebase_app_check: ^0.3.1+7
  firebase_crashlytics: ^4.1.5

  # Auth providers
  google_sign_in: ^6.2.2

  # Utilities
  crypto: ^3.0.6            # SHA-256 for client-side fairness verification
  intl: ^0.19.0            # number/date formatting
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # No bitmap card assets are bundled — cards are rendered with Flutter widgets
  # (see lib/features/game/presentation/widgets/playing_card.dart) so there are
  # no copyrighted-asset licensing concerns.
