# JVM args for the Gradle daemon. 4G is comfortable for a Flutter + Firebase build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# AndroidX (required by Flutter and all Firebase plugins).
android.useAndroidX=true
android.enableJetifier=false

# AGP 8 default; keeps R classes non-transitive for faster builds.
android.nonTransitiveRClass=true

# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
